# Cheap gate in front of Cursor Automations.
# GitHub path filter + this-push diff. No Cursor boot until a label lands.
# Labels: wake-sa · wake-engineer · wake-pm-look · fail-look · emerge
# Packet: this push lands PM-PACKET-NNN-*.md AND that file has **Wake:** sa
#   → wake-sa. Missing / hold = wait. Filename alone is not the go.
# Hotfix: this push lands HOTFIX-NNN-*.md → wake-engineer only (no wake-sa).
# Label adds must be the founder (WAKE_GITHUB_TOKEN), not github-actions[bot].
# Cursor's label trigger does not treat the Actions bot as the owner.
# Pass → emerge letter (issue + optional email). Not Travis. No LLM.
# See docs/register/AUTOMATION-PACKET-CHAIN.md

name: Wake packet seats

on:
  push:
    paths:
      - "docs/register/PM-PACKET-*.md"
      - "docs/register/SYSTEMS-CHANGE-PACKET-*.md"
      - "docs/register/PM-LOOK-*.md"
      - "docs/register/HOTFIX-*.md"
      - "docs/register/BLOCKER-*.md"
      - "docs/register/ENGINEER-HANDOFF.md"
      - "src/**"
      - ".github/workflows/wake-packet-seats.yml"
      - ".github/scripts/**"
  pull_request:
    types: [unlabeled]
  workflow_dispatch:
    inputs:
      nnn:
        description: Packet number to letter (e.g. 009)
        required: true

jobs:
  label:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Label the open PR for this push only
        env:
          WAKE_GITHUB_TOKEN: ${{ secrets.WAKE_GITHUB_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          HEAD_REF: ${{ github.ref_name }}
          EMERGE_EMAIL: ${{ secrets.EMERGE_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          set -euo pipefail
          if [[ -n "${WAKE_GITHUB_TOKEN:-}" ]]; then
            export GH_TOKEN="$WAKE_GITHUB_TOKEN"
            if login=$(gh api user --jq .login 2>/dev/null); then
              echo "Label actor: $login (WAKE_GITHUB_TOKEN)"
            else
              echo "WAKE_GITHUB_TOKEN rejected (401). Falling back to Actions bot."
              export GH_TOKEN="$FALLBACK_GH_TOKEN"
              echo "Label actor: github-actions[bot]"
            fi
          else
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
            echo "Label actor: github-actions[bot] (no WAKE_GITHUB_TOKEN)"
          fi
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            # New branch. `git diff $AFTER` is worktree vs tip — empty on a
            # clean checkout. Diff the tip commit itself.
            if git rev-parse --verify "${AFTER}^" >/dev/null 2>&1; then
              files=$(git diff --name-only "${AFTER}^" "$AFTER")
            else
              files=$(git diff-tree --no-commit-id --name-only -r "$AFTER")
            fi
          else
            files=$(git diff --name-only "$BEFORE" "$AFTER")
          fi
          echo "This push:"
          echo "$files"

          pr=""
          for i in 1 2 3 4 5 6; do
            pr=$(gh pr list --head "$HEAD_REF" --state open --json number --jq '.[0].number // empty')
            if [[ -n "$pr" ]]; then
              break
            fi
            echo "No open PR for $HEAD_REF yet. Wait ${i}."
            sleep 5
          done
          if [[ -z "$pr" ]]; then
            echo "No open PR for $HEAD_REF. Stop."
            exit 0
          fi

          gh label create wake-sa --color CCCCCC --description "Cursor: wake SA" 2>/dev/null || true
          gh label create wake-engineer --color CCCCCC --description "Cursor: wake Engineer" 2>/dev/null || true
          gh label create wake-pm-look --color CCCCCC --description "Cursor: wake Technical PM look+test" 2>/dev/null || true
          gh label create fail-look --color CCCCCC --description "Cursor: Engineer loop after PM look Fail" 2>/dev/null || true
          gh label create emerge --color CCCCCC --description "PM look Pass — human test" 2>/dev/null || true
          gh label create blocker --color B60205 --description "Founder ops block — remove when cleared to redeploy" 2>/dev/null || true

          # Circuit breaker (021): blocker file → label, sleep automations, mail founder.
          if echo "$files" | grep -E '^docs/register/BLOCKER-[0-9]+-.+\.md$' | grep -q .; then
            blocker=$(echo "$files" | grep -E '^docs/register/BLOCKER-[0-9]+-.+\.md$' | head -n 1)
            gh pr edit "$pr" --remove-label fail-look || true
            gh pr edit "$pr" --remove-label wake-engineer || true
            gh pr edit "$pr" --remove-label wake-pm-look || true
            if gh pr edit "$pr" --add-label blocker; then
              echo "Labeled #$pr blocker ($blocker)."
            fi
            cause=$(sed -n 's/^# Blocker [0-9]* — //p' "$blocker" | head -n 1)
            pocket=$(sed -n 's/^\*\*Pocket:\*\* //p' "$blocker" | head -n 1)
            if [[ -n "${EMERGE_EMAIL:-}" && -n "${RESEND_API_KEY:-}" && -n "${RESEND_FROM_EMAIL:-}" ]]; then
              python3 .github/scripts/send-blocker-letter.py "${pocket:-Packet}" "${cause:-founder ops}" "$blocker"
            else
              echo "No EMERGE_EMAIL + RESEND. Blocker file is the letter."
            fi
          fi

          # Blocker hold active — strip wake labels runtime-doors may have re-added
          # (repository_dispatch runs workflow from main until #177 merges).
          pr_labels=$(gh pr view "$pr" --json labels --jq '.labels[].name')
          if echo "$pr_labels" | grep -q '^blocker$'; then
            gh pr edit "$pr" --remove-label fail-look || true
            gh pr edit "$pr" --remove-label wake-engineer || true
            gh pr edit "$pr" --remove-label wake-pm-look || true
            echo "PR #$pr blocker active. Stripped fail-look / wake-engineer / wake-pm-look."
          fi

          # Hotfix pickup: this push lands HOTFIX-NNN-*.md. Title the PR
          # "Hotfix NNN — …" (human tell). Skip SA. Do not re-wake Engineer
          # on later commits on the same PR (file not in this push).
          if echo "$files" | grep -E '^docs/register/HOTFIX-[0-9]+-.+\.md$' | grep -v -- '-TEST\.md$' | grep -q .; then
            # File plus title. Merging main into a packet PR brings HOTFIX
            # files in this-push; that is not a hotfix cut.
            title=$(gh pr view "$pr" --json title --jq .title)
            if [[ "$title" == Hotfix\ * ]]; then
              # Re-arm: label-added only fires on a fresh add. A leftover
              # wake-engineer from an earlier push would otherwise stay silent.
              gh pr edit "$pr" --remove-label wake-engineer || true
              if gh pr edit "$pr" --add-label wake-engineer; then
                echo "Hotfix. Labeled #$pr wake-engineer. No wake-sa."
              else
                echo "Hotfix. Could not add wake-engineer. Fine-grained PAT needs Issues write AND Pull requests write on this repo."
              fi
            else
              echo "HOTFIX files in this push; PR title is not Hotfix ($title). No wake-engineer."
            fi
          elif echo "$files" | grep -E '^docs/register/PM-PACKET-[0-9]+-.+\.md$' | grep -v -- '-TEST\.md$' | grep -q .; then
            # Filename is not the go. Prose "then SA" is not the go.
            # Only an exact **Wake:** sa line on a packet in this push.
            # Missing / hold / anything else = wait. No wake-sa.
            go=""
            while IFS= read -r pkt; do
              [[ -z "$pkt" ]] && continue
              if git show "$AFTER:$pkt" | grep -q '^\*\*Wake:\*\* sa[[:space:]]*$'; then
                echo "$pkt has Wake: sa"
                go=1
              else
                echo "$pkt is on hold (no **Wake:** sa). No wake-sa from this file."
              fi
            done < <(echo "$files" | grep -E '^docs/register/PM-PACKET-[0-9]+-.+\.md$' | grep -v -- '-TEST\.md$')
            if [[ -n "$go" ]]; then
              gh pr edit "$pr" --add-label wake-sa
              echo "Labeled #$pr wake-sa"
            else
              echo "Packet waiting. No wake-sa."
            fi
          fi

          if echo "$files" | grep -E '^docs/register/SYSTEMS-CHANGE-PACKET-.+\.md$'; then
            gh pr edit "$pr" --add-label wake-engineer
            echo "Labeled #$pr wake-engineer"
          fi

          for f in $(echo "$files" | grep -E '^docs/register/PM-LOOK-.+\.md$' || true); do
            if git show "$AFTER:$f" | grep -q '^\*\*Verdict:\*\* Fail'; then
              gh pr edit "$pr" --add-label fail-look
              echo "Labeled #$pr fail-look"
              break
            fi
          done

          for f in $(echo "$files" | grep -E '^docs/register/PM-LOOK-.+\.md$' || true); do
            if ! git show "$AFTER:$f" | grep -q '^\*\*Verdict:\*\* Pass'; then
              continue
            fi
            pr_labels=$(gh pr view "$pr" --json labels --jq '.labels[].name')
            if echo "$pr_labels" | grep -q '^blocker$'; then
              echo "PR #$pr has blocker active. Do NOT emerge."
              continue
            fi
            hotfix=$(echo "$f" | sed -n 's#^docs/register/PM-LOOK-HOTFIX-\([0-9][0-9]*\).*#\1#p')
            nnn=$(echo "$f" | sed -n 's#^docs/register/PM-LOOK-\([0-9][0-9]*\).*#\1#p')
            if [[ -n "$hotfix" ]]; then
              nnn="$hotfix"
              kind="hotfix"
              testfile=$(git ls-tree -r --name-only "$AFTER" | grep -E "^docs/register/HOTFIX-${nnn}-.+-TEST\\.md$" | head -n 1 || true)
              issue_title="Hotfix ${nnn} emerged — walk this sheet"
              missing="No HOTFIX-${nnn}-*-TEST.md on this commit."
            elif [[ -n "$nnn" ]]; then
              kind="packet"
              testfile=$(git ls-tree -r --name-only "$AFTER" | grep -E "^docs/register/PM-PACKET-${nnn}-.+-TEST\\.md$" | head -n 1 || true)
              issue_title="${nnn} emerged — walk this sheet"
              missing="No PM-PACKET-${nnn}-*-TEST.md on this commit."
            else
              continue
            fi
            preview=$(git show "$AFTER:$f" | sed -n 's/^\*\*Preview:\*\* //p' | head -n 1)
            repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
            letter=$(mktemp)
            {
              if [[ "$kind" == "hotfix" ]]; then
                echo "Hotfix ${nnn} emerged. Human test."
              else
                echo "${nnn} emerged. Human test."
              fi
              echo
              echo "PR: https://github.com/${repo}/pull/${pr}"
              if [[ -n "$preview" ]]; then
                echo "Preview: ${preview}"
              fi
              echo "Look: Pass. Walk the sheet. SSO / Talk / a typed sentence are still yours."
              echo
              echo "This is house mail. Not Travis."
              echo
              if [[ -n "$testfile" ]]; then
                echo "Sheet: \`${testfile}\`"
                echo
                echo "---"
                echo
                git show "$AFTER:$testfile"
              else
                echo "$missing"
              fi
            } > "$letter"
            gh pr edit "$pr" --add-label emerge && echo "Labeled #$pr emerge" || echo "Could not label emerge"
            existing=$(gh issue list --state all --search "${issue_title} in:title" --json number --jq '.[0].number // empty')
            if [[ -z "$existing" ]]; then
              issue=$(gh issue create --title "$issue_title" --body-file "$letter" --assignee bywale-com \
                || gh issue create --title "$issue_title" --body-file "$letter")
              echo "Opened $issue"
            else
              echo "Issue #$existing already exists for ${nnn}"
            fi
            if [[ -n "${EMERGE_EMAIL:-}" && -n "${RESEND_API_KEY:-}" && -n "${RESEND_FROM_EMAIL:-}" ]]; then
              att=""
              if [[ -n "$testfile" ]]; then
                att=$(mktemp)
                git show "$AFTER:$testfile" > "$att"
              fi
              python3 .github/scripts/send-emerge-letter.py "$letter" "$nnn" "${att:-}" "${testfile:-}"
              rm -f "$att"
            else
              echo "No EMERGE_EMAIL + RESEND_API_KEY + RESEND_FROM_EMAIL. Issue is the letter."
            fi
            rm -f "$letter"
          done

          # Look: plant finished. src/ or (hotfix + Engineer handoff).
          # SQL-only hang may only rewrite ENGINEER-HANDOFF.md.
          # Circuit breaker law: do NOT wake PM look if the PR is under an active blocker hold.
          if echo "$files" | grep -qE '^(src/|docs/register/ENGINEER-HANDOFF\.md$)'; then
            pr_labels=$(gh pr view "$pr" --json labels --jq '.labels[].name')
            if echo "$pr_labels" | grep -q '^blocker$'; then
              echo "PR #$pr has blocker active. Do NOT wake PM look."
            else
              pr_files=$(gh pr view "$pr" --json files --jq '.files[].path')
              if echo "$pr_files" | grep -qE '^docs/register/HOTFIX-[0-9]+-.+\.md$'; then
                gh pr edit "$pr" --remove-label wake-pm-look || true
                if gh pr edit "$pr" --add-label wake-pm-look; then
                  echo "Labeled #$pr wake-pm-look (hotfix plant)"
                else
                  echo "Could not add wake-pm-look."
                fi
              elif echo "$pr_files" | grep -qE '^docs/register/SYSTEMS-CHANGE-PACKET-'; then
                if echo "$pr_files" | grep -qE '^docs/register/PM-PACKET-[0-9]'; then
                  gh pr edit "$pr" --add-label wake-pm-look
                  echo "Labeled #$pr wake-pm-look"
                fi
              fi
            fi
          fi

  release-blocker:
    if: github.event_name == 'pull_request' && github.event.action == 'unlabeled' && github.event.label.name == 'blocker'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.WAKE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Redeploy after founder cleared blocker
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Circuit breaker release — redeploy after blocker cleared"
          git push origin "HEAD:${HEAD_REF}"
          echo "Empty commit pushed. Vercel will rebuild."

  emerge-now:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Send emerge letter for one packet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMERGE_EMAIL: ${{ secrets.EMERGE_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NNN: ${{ github.event.inputs.nnn }}
        run: |
          set -euo pipefail
          nnn=$(echo "$NNN" | tr -cd '0-9')
          if [[ -z "$nnn" ]]; then
            echo "Need a packet number."
            exit 1
          fi
          nnn=$(printf '%03d' "$((10#$nnn))")
          testfile=$(git ls-tree -r --name-only HEAD | grep -E "^docs/register/PM-PACKET-${nnn}-.+-TEST\\.md$" | head -n 1 || true)
          look="docs/register/PM-LOOK-${nnn}.md"
          preview=""
          if [[ -f "$look" ]]; then
            preview=$(sed -n 's/^\*\*Preview:\*\* //p' "$look" | head -n 1)
          fi
          repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
          pr=$(gh pr list --state open --json number,files --jq '.[0].number // empty' || true)
          letter=$(mktemp)
          {
            echo "${nnn} emerged. Human test."
            echo
            if [[ -n "$pr" ]]; then
              echo "PR: https://github.com/${repo}/pull/${pr}"
            fi
            if [[ -n "$preview" ]]; then
              echo "Preview: ${preview}"
            fi
            echo "Look: Pass. Walk the sheet. SSO / Talk / a typed sentence are still yours."
            echo
            echo "This is house mail. Not Travis."
            echo
            if [[ -n "$testfile" ]]; then
              echo "Sheet: \`${testfile}\`"
              echo
              echo "---"
              echo
              cat "$testfile"
            else
              echo "No PM-PACKET-${nnn}-*-TEST.md on this commit."
            fi
          } > "$letter"
          if [[ -n "${EMERGE_EMAIL:-}" && -n "${RESEND_API_KEY:-}" && -n "${RESEND_FROM_EMAIL:-}" ]]; then
            att=""
            if [[ -n "$testfile" ]]; then
              att=$(mktemp)
              cat "$testfile" > "$att"
            fi
            python3 .github/scripts/send-emerge-letter.py "$letter" "$nnn" "${att:-}" "${testfile:-}"
            rm -f "$att"
          else
            echo "Missing EMERGE_EMAIL or RESEND_API_KEY or RESEND_FROM_EMAIL on this repo."
            exit 1
          fi
          rm -f "$letter"
