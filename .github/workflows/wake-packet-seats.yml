# Cheap gate in front of Cursor Automations.
# GitHub path filter + this-push diff. No Cursor boot until a label lands.
# Labels: wake-sa · wake-engineer · fail-look · emerge · blocker · previewing
# Packet: this push lands PM-PACKET-NNN-*.md AND that file has **Wake:** sa
#   → wake-sa. Missing / hold = wait. Filename alone is not the go.
# Hotfix: this push **adds** HOTFIX-NNN-*.md → wake-engineer only (no wake-sa).
#   A recut that edits a hotfix file already on the PR does not re-wake.
# One seat label at a time — adding a wake strips the others.
# blocker already on the PR → no new seat labels (hold).
# previewing on the PR → Vercel has the ball. No new seat. No second green-light.
# Plant finished (src/ or handoff on a packet/hotfix PR) → strip seats.
# No wake-pm-look. Lib verify is Engineer, last, after the handoff rewrite.
# Preview is opt-in: after handoff labels, blocker, and previewing are gone,
# empty-commit the green-light tag and add previewing in that same job.
# Label adds must be the founder (WAKE_GITHUB_TOKEN), not github-actions[bot].
# Cursor's label trigger does not treat the Actions bot as the owner.
# See docs/register/AUTOMATION-PACKET-CHAIN.md

name: Wake packet seats

on:
  pull_request:
    types: [unlabeled, labeled]
  push:
    paths:
      - "docs/register/PM-PACKET-*.md"
      - "docs/register/SYSTEMS-CHANGE-PACKET-*.md"
      - "docs/register/PM-LOOK-*.md"
      - "docs/register/HOTFIX-*.md"
      - "docs/register/BLOCKER-*.md"
      - "docs/register/ENGINEER-HANDOFF.md"
      - "src/**"
      - ".github/workflows/wake-packet-seats.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      nnn:
        description: Packet number to letter (e.g. 009)
        required: true

jobs:
  label:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      green_light: ${{ steps.label_step.outputs.green_light }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Label the open PR for this push only
        id: label_step
        env:
          WAKE_GITHUB_TOKEN: ${{ secrets.WAKE_GITHUB_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          HEAD_REF: ${{ github.ref_name }}
          EMERGE_EMAIL: ${{ secrets.EMERGE_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          set -euo pipefail
          if [[ -n "${WAKE_GITHUB_TOKEN:-}" ]]; then
            export GH_TOKEN="$WAKE_GITHUB_TOKEN"
            if login=$(gh api user --jq .login 2>/dev/null); then
              echo "Label actor: $login (WAKE_GITHUB_TOKEN)"
            else
              echo "WAKE_GITHUB_TOKEN rejected (401). Falling back to Actions bot."
              export GH_TOKEN="$FALLBACK_GH_TOKEN"
              echo "Label actor: github-actions[bot]"
            fi
          else
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
            echo "Label actor: github-actions[bot] (no WAKE_GITHUB_TOKEN)"
          fi
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            # New branch. `git diff $AFTER` is worktree vs tip — empty on a
            # clean checkout. Diff the tip commit itself.
            if git rev-parse --verify "${AFTER}^" >/dev/null 2>&1; then
              files=$(git diff --name-only "${AFTER}^" "$AFTER")
              added=$(git diff --name-only --diff-filter=A "${AFTER}^" "$AFTER")
            else
              files=$(git diff-tree --no-commit-id --name-only -r "$AFTER")
              added=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$AFTER")
            fi
          else
            files=$(git diff --name-only "$BEFORE" "$AFTER")
            added=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER")
          fi
          echo "This push:"
          echo "$files"
          echo "Added in this push:"
          echo "$added"

          pr=""
          for i in 1 2 3 4 5 6; do
            pr=$(gh pr list --head "$HEAD_REF" --state open --json number --jq '.[0].number // empty')
            if [[ -n "$pr" ]]; then
              break
            fi
            echo "No open PR for $HEAD_REF yet. Wait ${i}."
            sleep 5
          done
          if [[ -z "$pr" ]]; then
            echo "No open PR for $HEAD_REF. Stop."
            exit 0
          fi

          gh label create wake-sa --color CCCCCC --description "Cursor: wake SA" 2>/dev/null || true
          gh label create wake-engineer --color CCCCCC --description "Cursor: wake Engineer" 2>/dev/null || true
          gh label create wake-pm-look --color CCCCCC --description "Cursor: wake Technical PM look+test" 2>/dev/null || true
          gh label create fail-look --color CCCCCC --description "Cursor: Engineer loop after PM look Fail" 2>/dev/null || true
          gh label create emerge --color CCCCCC --description "PM look Pass — human test" 2>/dev/null || true
          gh label create blocker --color CCCCCC --description "Founder ops hold — automations sleep" 2>/dev/null || true
          gh label create previewing --color 1D76DB --description "Vercel has the ball — no second green-light, no new seat" 2>/dev/null || true
          gh label create preview --color 0E8A16 --description "Cursor: manually trigger Vercel preview build" 2>/dev/null || true

          strip_seats_except() {
            keep="${1:-}"
            for l in wake-sa wake-engineer wake-pm-look fail-look; do
              if [[ "$l" != "$keep" ]]; then
                gh pr edit "$pr" --remove-label "$l" || true
              fi
            done
          }
          add_seat() {
            lab="$1"
            if gh pr view "$pr" --json labels --jq '.labels[].name' | grep -qx previewing; then
              echo "previewing on #$pr. No new seat ($lab)."
              return 0
            fi
            strip_seats_except "$lab"
            gh pr edit "$pr" --remove-label "$lab" || true
            gh pr edit "$pr" --add-label "$lab"
          }

          # Blocker hold: this push lands BLOCKER-NNN-*.md (not *-RESOLVED).
          # Label blocker, strip seat wakes, mail founder. No wake-engineer.
          blocker_file=""
          while IFS= read -r bf; do
            [[ -z "$bf" ]] && continue
            if [[ "$bf" == *-RESOLVED.md ]]; then
              continue
            fi
            blocker_file="$bf"
            break
          done < <(echo "$files" | grep -E '^docs/register/BLOCKER-[0-9]+-.+\.md$' || true)
          if [[ -n "$blocker_file" ]]; then
            gh pr edit "$pr" --remove-label fail-look || true
            gh pr edit "$pr" --remove-label wake-sa || true
            gh pr edit "$pr" --remove-label wake-engineer || true
            gh pr edit "$pr" --remove-label wake-pm-look || true
            # Do not remove blocker to re-arm. That unlabeled event is the
            # founder-release trigger and would race a green-light commit.
            if gh pr edit "$pr" --add-label blocker; then
              echo "Labeled #$pr blocker (hold)."
            else
              echo "Could not add blocker label."
            fi
            if [[ -n "${EMERGE_EMAIL:-}" && -n "${RESEND_API_KEY:-}" && -n "${RESEND_FROM_EMAIL:-}" ]]; then
              python3 .github/scripts/send-blocker-letter.py "$blocker_file"
            else
              echo "No EMERGE_EMAIL + RESEND_API_KEY + RESEND_FROM_EMAIL. Blocker label only."
            fi
            echo "Blocker hold active. No further seat labels on this push."
            exit 0
          fi

          if gh pr view "$pr" --json labels --jq '.labels[].name' | grep -qx blocker; then
            strip_seats_except ""
            echo "blocker already on #$pr. Stripped leftover seat labels. No new wakes."
            exit 0
          fi

          # Hotfix pickup: this push **adds** HOTFIX-NNN-*.md (not an edit of
          # a file already on the PR). Title the PR "Hotfix NNN — …". Skip SA.
          # Recuts that touch the hotfix doc must not re-arm wake-engineer.
          if echo "$added" | grep -E '^docs/register/HOTFIX-[0-9]+-.+\.md$' | grep -v -- '-TEST\.md$' | grep -q .; then
            # File plus title. Merging main into a packet PR brings HOTFIX
            # files in this-push; that is not a hotfix cut.
            title=$(gh pr view "$pr" --json title --jq .title)
            if [[ "$title" == Hotfix\ * ]]; then
              # Re-arm: label-added only fires on a fresh add. A leftover
              # wake-engineer from an earlier push would otherwise stay silent.
              if add_seat wake-engineer; then
                echo "Hotfix (new file). Labeled #$pr wake-engineer. No wake-sa."
              else
                echo "Hotfix. Could not add wake-engineer. Fine-grained PAT needs Issues write AND Pull requests write on this repo."
              fi
            else
              echo "HOTFIX files added; PR title is not Hotfix ($title). No wake-engineer."
            fi
          elif echo "$files" | grep -E '^docs/register/PM-PACKET-[0-9]+-.+\.md$' | grep -v -- '-TEST\.md$' | grep -q .; then
            # Filename is not the go. Prose "then SA" is not the go.
            # Only an exact **Wake:** sa line on a packet in this push.
            # Missing / hold / anything else = wait. No wake-sa.
            go=""
            while IFS= read -r pkt; do
              [[ -z "$pkt" ]] && continue
              if git show "$AFTER:$pkt" | grep -q '^\*\*Wake:\*\* sa[[:space:]]*$'; then
                echo "$pkt has Wake: sa"
                go=1
              else
                echo "$pkt is on hold (no **Wake:** sa). No wake-sa from this file."
              fi
            done < <(echo "$files" | grep -E '^docs/register/PM-PACKET-[0-9]+-.+\.md$' | grep -v -- '-TEST\.md$')
            if [[ -n "$go" ]]; then
              add_seat wake-sa
              echo "Labeled #$pr wake-sa"
            else
              echo "Packet waiting. No wake-sa."
            fi
          fi

          if echo "$files" | grep -E '^docs/register/SYSTEMS-CHANGE-PACKET-.+\.md$'; then
            add_seat wake-engineer
            echo "Labeled #$pr wake-engineer"
          fi

          for f in $(echo "$files" | grep -E '^docs/register/PM-LOOK-.+\.md$' || true); do
            if git show "$AFTER:$f" | grep -q '^\*\*Verdict:\*\* Fail'; then
              add_seat fail-look
              echo "Labeled #$pr fail-look"
              break
            fi
          done

          # Plant finished. src/ or (hotfix + Engineer handoff).
          # SQL-only hang may only rewrite ENGINEER-HANDOFF.md.
          # Do not wake PM Look. Strip seats so preview-when-clear may fire.
          if echo "$files" | grep -qE '^(src/|docs/register/ENGINEER-HANDOFF\.md$)'; then
            pr_files=$(gh pr view "$pr" --json files --jq '.files[].path')
            if echo "$pr_files" | grep -qE '^docs/register/HOTFIX-[0-9]+-.+\.md$'; then
              strip_seats_except ""
              echo "Hotfix plant finished. No wake-pm-look. Seats stripped."
              echo "green_light=true" >> "$GITHUB_OUTPUT"
            elif echo "$pr_files" | grep -qE '^docs/register/SYSTEMS-CHANGE-PACKET-'; then
              if echo "$pr_files" | grep -qE '^docs/register/PM-PACKET-[0-9]'; then
                strip_seats_except ""
                echo "Packet plant finished. No wake-pm-look. Seats stripped."
                echo "green_light=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

  preview-when-clear:
    needs: [label]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && needs.label.result == 'success' && needs.label.outputs.green_light == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: green-light-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.WAKE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Green-light preview when handoffs are done
        env:
          GH_TOKEN: ${{ secrets.WAKE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pr=""
          for i in 1 2 3 4 5 6; do
            pr=$(gh pr list --head "$HEAD_REF" --state open --json number --jq '.[0].number // empty')
            if [[ -n "$pr" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$pr" ]]; then
            echo "No open PR for $HEAD_REF. No green light."
            exit 0
          fi
          sh .github/scripts/preview-when-clear.sh "$pr" "$HEAD_REF"

  manual-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    concurrency:
      group: green-light-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.WAKE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Green-light preview after manual preview label added
        env:
          GH_TOKEN: ${{ secrets.WAKE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          gh pr edit "$PR" --remove-label preview || true
          sh .github/scripts/preview-when-clear.sh "$PR" "$HEAD_REF"

  blocker-release:
    if: github.event_name == 'pull_request' && github.event.action == 'unlabeled' && github.event.label.name == 'blocker'
    runs-on: ubuntu-latest
    concurrency:
      group: green-light-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.WAKE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Green-light preview after blocker cleared
        env:
          GH_TOKEN: ${{ secrets.WAKE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          sh .github/scripts/preview-when-clear.sh "$PR" "$HEAD_REF"

  emerge-now:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Send emerge letter for one packet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMERGE_EMAIL: ${{ secrets.EMERGE_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          NNN: ${{ github.event.inputs.nnn }}
        run: |
          set -euo pipefail
          nnn=$(echo "$NNN" | tr -cd '0-9')
          if [[ -z "$nnn" ]]; then
            echo "Need a packet number."
            exit 1
          fi
          nnn=$(printf '%03d' "$((10#$nnn))")
          testfile=$(git ls-tree -r --name-only HEAD | grep -E "^docs/register/PM-PACKET-${nnn}-.+-TEST\\.md$" | head -n 1 || true)
          look="docs/register/PM-LOOK-${nnn}.md"
          preview=""
          if [[ -f "$look" ]]; then
            preview=$(sed -n 's/^\*\*Preview:\*\* //p' "$look" | head -n 1)
          fi
          repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
          pr=$(gh pr list --state open --json number,files --jq '.[0].number // empty' || true)
          letter=$(mktemp)
          {
            echo "${nnn} emerged. Human test."
            echo
            if [[ -n "$pr" ]]; then
              echo "PR: https://github.com/${repo}/pull/${pr}"
            fi
            if [[ -n "$preview" ]]; then
              echo "Preview: ${preview}"
            fi
            echo "Look: Pass. Walk the sheet. SSO / Talk / a typed sentence are still yours."
            echo
            echo "This is house mail. Not Travis."
            echo
            if [[ -n "$testfile" ]]; then
              echo "Sheet: \`${testfile}\`"
              echo
              echo "---"
              echo
              cat "$testfile"
            else
              echo "No PM-PACKET-${nnn}-*-TEST.md on this commit."
            fi
          } > "$letter"
          if [[ -n "${EMERGE_EMAIL:-}" && -n "${RESEND_API_KEY:-}" && -n "${RESEND_FROM_EMAIL:-}" ]]; then
            att=""
            if [[ -n "$testfile" ]]; then
              att=$(mktemp)
              cat "$testfile" > "$att"
            fi
            python3 .github/scripts/send-emerge-letter.py "$letter" "$nnn" "${att:-}" "${testfile:-}"
            rm -f "$att"
          else
            echo "Missing EMERGE_EMAIL or RESEND_API_KEY or RESEND_FROM_EMAIL on this repo."
            exit 1
          fi
          rm -f "$letter"
