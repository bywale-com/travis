# Deployment Check: Vercel hangs `vercel.deployment.ready` until this job
# paints. Do not fold this into wake-packet-seats.yml — that file wakes seats.
# Official hang: https://vercel.com/docs/deployment-checks
# Red → fail-look always. Engineer triages plant vs founder ops (021 circuit breaker).
#
# repository_dispatch always runs THIS FILE FROM main. The blocker → no
# fail-look skip must live on main or a later deploy re-wakes Engineer.
# Walks still run. The check still paints red. Engineer is not re-woken
# while BLOCKER-*.md or the `blocker` label is on.
name: Runtime doors

on:
  repository_dispatch:
    types: [vercel.deployment.ready]

permissions:
  contents: read
  statuses: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  runtime-doors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the commit this deploy built
        uses: vercel/repository-dispatch/actions/checkout@v1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lib unit tests
        run: npm test

      - name: Sequential walks on this URL
        id: walks
        env:
          RUNTIME_BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TRAVIS_TEST_OPERATOR_COOKIE: ${{ secrets.TRAVIS_TEST_OPERATOR_COOKIE }}
        run: |
          test -n "$RUNTIME_BASE_URL" || { echo "missing deploy URL"; exit 1; }
          set -o pipefail
          npm run test:runtime 2>&1 | tee "$RUNNER_TEMP/walks.txt"

      - name: Paint the Vercel Deployment Check
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: runtime-doors

      - name: Fresh-add fail-look on the open PR
        if: failure()
        env:
          WAKE_GITHUB_TOKEN: ${{ secrets.WAKE_GITHUB_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.client_payload.git.sha }}
          WALK_LOG: ${{ runner.temp }}/walks.txt
        run: |
          set -euo pipefail
          if [[ -n "${WAKE_GITHUB_TOKEN:-}" ]]; then
            export GH_TOKEN="$WAKE_GITHUB_TOKEN"
            if login=$(gh api user --jq .login 2>/dev/null); then
              echo "Label actor: $login (WAKE_GITHUB_TOKEN)"
            else
              echo "WAKE_GITHUB_TOKEN rejected (401). Falling back to Actions bot."
              export GH_TOKEN="$FALLBACK_GH_TOKEN"
              echo "Label actor: github-actions[bot] — B will not see this add."
            fi
          else
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
            echo "Label actor: github-actions[bot] (no WAKE_GITHUB_TOKEN) — B will not see this add."
          fi

          sha="${DEPLOY_SHA:-}"
          if [[ -z "$sha" ]]; then
            echo "No client_payload.git.sha. No fail-look."
            exit 0
          fi

          # Checkout is at DEPLOY_SHA — blocker file on this commit means hold is active.
          if compgen -G "docs/register/BLOCKER-[0-9]*-*.md" > /dev/null; then
            echo "Blocker file on deploy commit. No fail-look."
            exit 0
          fi

          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
            --jq '[.[] | select(.state=="open")][0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No open PR for $sha. No fail-look."
            exit 0
          fi

          pr_labels=$(gh pr view "$pr" --json labels --jq '.labels[].name')
          if echo "$pr_labels" | grep -q '^blocker$'; then
            echo "PR #$pr has blocker active. No fail-look."
            exit 0
          fi

          gh label create fail-look --color CCCCCC --description "Cursor: Engineer loop after PM look Fail" 2>/dev/null || true
          gh pr edit "$pr" --remove-label fail-look || true
          if gh pr edit "$pr" --add-label fail-look; then
            echo "Labeled #$pr fail-look (fresh add)."
          else
            echo "Could not add fail-look on #$pr."
            exit 1
          fi
