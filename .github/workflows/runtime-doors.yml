# Deployment Check: Vercel hangs `vercel.deployment.ready` until this job
# paints. Do not fold this into wake-packet-seats.yml — that file wakes seats.
# Official hang: https://vercel.com/docs/deployment-checks
# Red → fail-look only when the PR is idle (no handoff / hold / previewing).
# Engineer triages plant vs founder ops (021 circuit breaker).
#
# repository_dispatch always runs THIS FILE FROM main. The handoff/hold
# → no fail-look skip must live on main or a later deploy re-wakes Engineer.
# Walks still run. The check still paints red. Engineer is not re-woken
# while wake-sa / wake-engineer / wake-pm-look / fail-look / blocker /
# previewing are on. Doors paint → clear previewing, then maybe fail-look.
name: Runtime doors

on:
  repository_dispatch:
    types: [vercel.deployment.ready]

concurrency:
  group: runtime-doors
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write
  actions: read
  pull-requests: write
  issues: write

jobs:
  runtime-doors:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the commit this deploy built
        uses: vercel/repository-dispatch/actions/checkout@v1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lib unit tests
        run: npm test

      - name: Sequential walks on this URL
        id: walks
        env:
          RUNTIME_BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TRAVIS_TEST_OPERATOR_COOKIE: ${{ secrets.TRAVIS_TEST_OPERATOR_COOKIE }}
        run: |
          test -n "$RUNTIME_BASE_URL" || { echo "missing deploy URL"; exit 1; }
          set -o pipefail
          npm run test:runtime 2>&1 | tee "$RUNNER_TEMP/walks.txt"

      - name: Paint red unless walks succeeded
        if: always() && steps.walks.outcome != 'success'
        run: |
          echo "Walks outcome=${{ steps.walks.outcome }} — runtime-doors is red"
          exit 1

      - name: Paint the Vercel Deployment Check
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: runtime-doors

      - name: Clear previewing after doors paint
        if: always()
        env:
          WAKE_GITHUB_TOKEN: ${{ secrets.WAKE_GITHUB_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.client_payload.git.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${WAKE_GITHUB_TOKEN:-}" ]]; then
            export GH_TOKEN="$WAKE_GITHUB_TOKEN"
            if ! gh api user --jq .login >/dev/null 2>&1; then
              export GH_TOKEN="$FALLBACK_GH_TOKEN"
            fi
          else
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
          fi

          sha="${DEPLOY_SHA:-}"
          if [[ -z "$sha" ]]; then
            echo "No client_payload.git.sha. No previewing clear."
            exit 0
          fi

          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
            --jq '[.[] | select(.state=="open")][0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No open PR for $sha. No previewing clear."
            exit 0
          fi

          gh pr edit "$pr" --remove-label previewing || true
          echo "Cleared previewing on #$pr (doors painted)."

      - name: Fresh-add fail-look on the open PR
        if: failure() || cancelled()
        env:
          WAKE_GITHUB_TOKEN: ${{ secrets.WAKE_GITHUB_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.client_payload.git.sha }}
          WALK_LOG: ${{ runner.temp }}/walks.txt
        run: |
          set -euo pipefail
          if [[ -n "${WAKE_GITHUB_TOKEN:-}" ]]; then
            export GH_TOKEN="$WAKE_GITHUB_TOKEN"
            if login=$(gh api user --jq .login 2>/dev/null); then
              echo "Label actor: $login (WAKE_GITHUB_TOKEN)"
            else
              echo "WAKE_GITHUB_TOKEN rejected (401). Falling back to Actions bot."
              export GH_TOKEN="$FALLBACK_GH_TOKEN"
              echo "Label actor: github-actions[bot] — B will not see this add."
            fi
          else
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
            echo "Label actor: github-actions[bot] (no WAKE_GITHUB_TOKEN) — B will not see this add."
          fi

          sha="${DEPLOY_SHA:-}"
          if [[ -z "$sha" ]]; then
            echo "No client_payload.git.sha. No fail-look."
            exit 0
          fi

          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
            --jq '[.[] | select(.state=="open")][0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No open PR for $sha. No fail-look."
            exit 0
          fi

          pr_labels=$(gh pr view "$pr" --json labels --jq '.labels[].name')
          for hold in wake-sa wake-engineer wake-pm-look fail-look blocker previewing; do
            if echo "$pr_labels" | grep -qx "$hold"; then
              echo "PR #$pr has $hold (handoff/hold). No fail-look."
              exit 0
            fi
          done

          gh label create fail-look --color CCCCCC --description "Cursor: Engineer loop after PM look Fail" 2>/dev/null || true
          gh pr edit "$pr" --remove-label fail-look || true
          if gh pr edit "$pr" --add-label fail-look; then
            echo "Labeled #$pr fail-look (fresh add)."
          else
            echo "Could not add fail-look on #$pr."
            exit 1
          fi

      - name: Emerge packet on success
        if: success()
        env:
          WAKE_GITHUB_TOKEN: ${{ secrets.WAKE_GITHUB_TOKEN }}
          FALLBACK_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event.client_payload.git.sha }}
          DEPLOY_URL: ${{ github.event.client_payload.url }}
          EMERGE_EMAIL: ${{ secrets.EMERGE_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          set -euo pipefail
          if [[ -n "${WAKE_GITHUB_TOKEN:-}" ]]; then
            export GH_TOKEN="$WAKE_GITHUB_TOKEN"
            if ! gh api user --jq .login >/dev/null 2>&1; then
              export GH_TOKEN="$FALLBACK_GH_TOKEN"
            fi
          else
            export GH_TOKEN="$FALLBACK_GH_TOKEN"
          fi

          sha="${DEPLOY_SHA:-}"
          if [[ -z "$sha" ]]; then
            echo "No client_payload.git.sha. No emerge packet."
            exit 0
          fi

          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
            --jq '[.[] | select(.state=="open")][0].number // empty')
          if [[ -z "$pr" ]]; then
            echo "No open PR for $sha. No emerge packet."
            exit 0
          fi

          pr_files=$(gh pr view "$pr" --json files --jq '.files[].path')
          hotfix_file=$(echo "$pr_files" | grep -E '^docs/register/HOTFIX-[0-9]+-.+\.md$' | grep -v -- '-TEST\.md$' | sort -V | tail -n 1 || true)
          packet_file=$(echo "$pr_files" | grep -E '^docs/register/PM-PACKET-[0-9]+-.+\.md$' | grep -v -- '-TEST\.md$' | sort -V | tail -n 1 || true)

          kind=""
          nnn=""
          testfile=""
          issue_title=""
          missing=""

          if [[ -n "$hotfix_file" ]]; then
            kind="hotfix"
            nnn=$(echo "$hotfix_file" | sed -n 's#^docs/register/HOTFIX-\([0-9][0-9]*\).*#\1#p')
            testfile=$(git ls-tree -r --name-only HEAD | grep -E "^docs/register/HOTFIX-${nnn}-.+-TEST\\.md$" | head -n 1 || true)
            issue_title="Hotfix ${nnn} emerged — walk this sheet"
            missing="No HOTFIX-${nnn}-*-TEST.md on this commit."
          elif [[ -n "$packet_file" ]]; then
            kind="packet"
            nnn=$(echo "$packet_file" | sed -n 's#^docs/register/PM-PACKET-\([0-9][0-9]*\).*#\1#p')
            testfile=$(git ls-tree -r --name-only HEAD | grep -E "^docs/register/PM-PACKET-${nnn}-.+-TEST\\.md$" | head -n 1 || true)
            issue_title="${nnn} emerged — walk this sheet"
            missing="No PM-PACKET-${nnn}-*-TEST.md on this commit."
          else
            echo "PR #$pr is neither a hotfix nor a packet PR. No emerge packet."
            exit 0
          fi

          preview="${DEPLOY_URL:-}"
          repo=$(gh repo view --json nameWithOwner --jq .nameWithOwner)
          letter=$(mktemp)
          {
            if [[ "$kind" == "hotfix" ]]; then
              echo "Hotfix ${nnn} emerged. Human test."
            else
              echo "${nnn} emerged. Human test."
            fi
            echo
            echo "PR: https://github.com/${repo}/pull/${pr}"
            if [[ -n "$preview" ]]; then
              echo "Preview: ${preview}"
            fi
            echo "Doors: Green (runtime-doors painted pass). Walk the sheet. SSO / Talk / a typed sentence are still yours."
            echo
            echo "This is house mail. Not Travis."
            echo
            if [[ -n "$testfile" && -f "$testfile" ]]; then
              echo "Sheet: \`${testfile}\`"
              echo
              echo "---"
              echo
              cat "$testfile"
            else
              echo "$missing"
            fi
          } > "$letter"

          gh label create emerge --color CCCCCC --description "Doors Pass — human test" 2>/dev/null || true
          gh pr edit "$pr" --add-label emerge && echo "Labeled #$pr emerge" || echo "Could not label emerge"

          existing=$(gh issue list --state all --search "${issue_title} in:title" --json number --jq '.[0].number // empty' || true)
          if [[ -z "$existing" ]]; then
            issue=$(gh issue create --title "$issue_title" --body-file "$letter" --assignee bywale-com \
              || gh issue create --title "$issue_title" --body-file "$letter" || true)
            echo "Opened $issue"
          else
            echo "Issue #$existing already exists for ${nnn}"
          fi

          if [[ -n "${EMERGE_EMAIL:-}" && -n "${RESEND_API_KEY:-}" && -n "${RESEND_FROM_EMAIL:-}" ]]; then
            att=""
            if [[ -n "$testfile" && -f "$testfile" ]]; then
              att="$testfile"
            fi
            python3 .github/scripts/send-emerge-letter.py "$letter" "$nnn" "${att:-}" "${testfile:-}"
          else
            echo "No EMERGE_EMAIL + RESEND_API_KEY + RESEND_FROM_EMAIL. Issue is the letter."
          fi
          rm -f "$letter"
